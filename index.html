<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Technology Service Centre | 45+ Home & Commercial Services Hyderabad</title>
  <meta name="description" content="45+ professional home, electrical, EV charger, appliance, and commercial maintenance services in Hyderabad by Global Technology Service Centre." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #15171c;
      --bg-dark-card: #1e2128;
      --bg-light: #f4f4f1;
      --card-light: #ffffff;
      --accent-beige: #dcc8a9;
      --accent-beige-hover: #ead9be;
      --text-light: #f8f8f6;
      --text-muted-dark: #9fa5b2;
      --text-dark: #181a1f;
      --text-muted-light: #5c6270;
      --border-dark: rgba(255, 255, 255, 0.12);
      --border-light: rgba(24, 26, 31, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(21, 23, 28, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-dark);
      padding: 15px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      color: var(--text-light);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .brand-sub {
      color: var(--accent-beige);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links {
      display: flex;
      gap: 22px;
    }

    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent-beige);
    }

    .btn-header {
      background: var(--accent-beige);
      color: var(--bg-dark);
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .btn-header:hover {
      background: var(--accent-beige-hover);
      transform: translateY(-1px);
    }

    /* HERO SECTION */
    .hero {
      background: radial-gradient(circle at 75% 45%, #262b36 0%, var(--bg-dark) 65%);
      color: var(--text-light);
      padding: 65px 6% 45px;
      border-bottom: 1px solid var(--border-dark);
    }

    .hero-grid {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      align-items: center;
      gap: 40px;
    }

    .hero-tag {
      display: inline-block;
      color: var(--accent-beige);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: clamp(34px, 5vw, 60px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -1.5px;
      margin-bottom: 18px;
    }

    .hero p {
      color: var(--text-muted-dark);
      font-size: 17px;
      line-height: 1.6;
      max-width: 560px;
      margin-bottom: 28px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn-primary {
      background: var(--accent-beige);
      color: var(--bg-dark);
      padding: 13px 22px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--accent-beige);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--accent-beige-hover);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-light);
      padding: 13px 22px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.28);
      transition: all 0.25s ease;
    }

    .btn-outline:hover {
      border-color: var(--accent-beige);
      color: var(--accent-beige);
      background: rgba(220, 200, 169, 0.06);
    }

    .hero-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted-dark);
      margin-bottom: 42px;
    }

    .hero-highlights span {
      color: var(--text-light);
    }

    /* 3D ROTATING HOME */
    .house-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1100px;
      min-height: 270px;
    }

    .house-3d-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      transform-style: preserve-3d;
      animation: rotate3dHouse 8s ease-in-out infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .house-glow {
      position: absolute;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(220, 200, 169, 0.32) 0%, rgba(220, 200, 169, 0) 70%);
      border-radius: 50%;
      filter: blur(20px);
    }

    .house-svg {
      width: 195px;
      height: 195px;
      z-index: 2;
      filter: drop-shadow(0 25px 30px rgba(0, 0, 0, 0.6));
    }

    @keyframes rotate3dHouse {
      0% { transform: rotateY(-25deg) rotateX(8deg) translateY(0px); }
      50% { transform: rotateY(25deg) rotateX(-5deg) translateY(-14px); }
      100% { transform: rotateY(-25deg) rotateX(8deg) translateY(0px); }
    }

    /* META BAR */
    .hero-meta-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding-top: 24px;
      border-top: 1px solid var(--border-dark);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .meta-item h4 {
      color: var(--accent-beige);
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .meta-item p {
      color: var(--text-muted-dark);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 0;
    }

    /* MARQUEE TICKER */
    .marquee-bar {
      background: #e9e8e3;
      border-bottom: 1px solid var(--border-light);
      padding: 13px 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .marquee-track {
      display: inline-block;
      animation: marqueeScroll 32s linear infinite;
    }

    .marquee-track span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: var(--text-muted-light);
      text-transform: uppercase;
      margin: 0 18px;
    }

    @keyframes marqueeScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* CATALOGUE SECTION */
    .catalogue {
      max-width: 1280px;
      margin: 0 auto;
      padding: 65px 6%;
    }

    .catalogue-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 28px;
    }

    .catalogue-tag {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-muted-light);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .catalogue h2 {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    .catalogue-desc {
      font-size: 15px;
      color: var(--text-muted-light);
      max-width: 720px;
      line-height: 1.6;
    }

    .count-badge {
      background: var(--bg-dark);
      color: var(--accent-beige);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    /* SEARCH & FILTERS */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }

    .search-box {
      width: 100%;
      max-width: 540px;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      background: var(--card-light);
      font-size: 15px;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s;
    }

    .search-box:focus {
      border-color: var(--bg-dark);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .pill {
      padding: 8px 15px;
      border-radius: 999px;
      border: 1px solid var(--border-light);
      background: var(--card-light);
      color: var(--text-dark);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill:hover, .pill.active {
      background: var(--bg-dark);
      color: var(--text-light);
      border-color: var(--bg-dark);
    }

    /* 3D SERVICE CARDS GRID */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 22px;
      perspective: 1400px;
    }

    @keyframes card3dReveal {
      0% {
        opacity: 0;
        transform: perspective(1000px) rotateX(18deg) translateY(28px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: perspective(1000px) rotateX(0deg) translateY(0px) scale(1);
      }
    }

    .service-card {
      background: var(--card-light);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform-style: preserve-3d;
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      animation: card3dReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    .service-card:hover {
      box-shadow: 0 22px 42px rgba(21, 23, 28, 0.14);
    }

    /* 3D VISUAL STAGE INSIDE EACH CARD */
    .card-3d-stage {
      position: relative;
      height: 175px;
      background: radial-gradient(circle at 50% 45%, #2a2f3b 0%, #16181e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 800px;
    }

    .card-3d-grid-bg {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(220, 200, 169, 0.07) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(220, 200, 169, 0.07) 1px, transparent 1px);
      background-size: 24px 24px;
      transform: rotateX(45deg) scale(1.4);
      opacity: 0.6;
    }

    .card-3d-pedestal {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
      border: 1px solid rgba(220, 200, 169, 0.35);
      box-shadow: 0 18px 30px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      animation: float3dObject 5s ease-in-out infinite;
      transition: transform 0.35s ease;
    }

    .service-card:hover .card-3d-pedestal {
      transform: translateZ(28px) rotateY(16deg) rotateX(10deg) scale(1.08);
    }

    @keyframes float3dObject {
      0%, 100% { transform: translateY(0px) rotateY(-8deg); }
      50% { transform: translateY(-7px) rotateY(8deg); }
    }

    .card-3d-icon {
      font-size: 44px;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.5));
      transform: translateZ(22px);
    }

    .card-number-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(21, 23, 28, 0.8);
      color: var(--text-muted-dark);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 9px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
    }

    .card-3d-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(21, 23, 28, 0.85);
      color: var(--accent-beige);
      border: 1px solid rgba(220, 200, 169, 0.35);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-cat {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-muted-light);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 13.5px;
      color: var(--text-muted-light);
      line-height: 1.
